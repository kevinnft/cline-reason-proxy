<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — Cline Reason Proxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #090b10;
    --bg-surface: #11151f;
    --bg-surface-elevated: #161b27;
    --bg-subtle: #1c2232;
    --border-subtle: #1f2738;
    --border-strong: #2a354c;
    --border-focus: #3b82f6;
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-subtle: rgba(59, 130, 246, 0.12);
    --accent-border: rgba(59, 130, 246, 0.3);
    
    --danger: #ef4444;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
    
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --shadow-card: 0 10px 40px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13.5px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 36px 32px 30px;
    box-shadow: var(--shadow-card);
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .brand-badge {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .sub {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: all 0.15s ease;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  input[type="password"], input[type="text"] {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
  }

  .btn-toggle {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    padding: 0 14px;
    cursor: pointer;
    font-family: var(--font-sans);
  }

  .btn-toggle:hover {
    color: var(--text-primary);
  }

  .btn-submit {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: var(--radius-md);
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-submit:hover {
    background: var(--accent-hover);
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
  }

  .btn-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error-message {
    min-height: 20px;
    color: var(--danger);
    font-size: 12.5px;
    margin-top: 12px;
    font-weight: 500;
  }

  .card-footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .card-footer code {
    font-family: var(--font-mono);
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-badge">C</div>
      <div>
        <h1>CRP Gateway</h1>
        <div style="font-size:12px; color:var(--text-muted);">Cline Reason Proxy Console</div>
      </div>
    </div>

    <p class="sub">Authenticate with your management API key to configure reasoning models and view live telemetry.</p>

    <form id="f" autocomplete="off">
      <label for="key">Proxy API Key</label>
      <div class="input-wrapper">
        <input id="key" name="api_key" type="password" placeholder="sk-crp-..." spellcheck="false" autocapitalize="off" autocomplete="current-password" autofocus required/>
        <button type="button" class="btn-toggle" id="toggle">Show</button>
      </div>

      <button type="submit" class="btn-submit" id="go">Sign In to Dashboard</button>
      <div class="error-message" id="err"></div>

      <div class="card-footer">
        Session authenticated via secure <code>crp_session</code> cookie (30 days validity). Bearer token is identical to <code>/v1</code> endpoint auth.
      </div>
    </form>
  </div>

<script>
const key = document.getElementById("key");
const err = document.getElementById("err");
const go = document.getElementById("go");
document.getElementById("toggle").onclick = () => {
  const isPwd = key.type === "password";
  key.type = isPwd ? "text" : "password";
  document.getElementById("toggle").textContent = isPwd ? "Hide" : "Show";
};
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = "";
  go.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ api_key: key.value.trim() }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok) {
      location.replace("/");
      return;
    }
    err.textContent = (body.error && body.error.message) || ("Authentication failed (HTTP " + r.status + ")");
  } catch (ex) {
    err.textContent = "Network error connecting to proxy";
  } finally {
    go.disabled = false;
  }
};
</script>
</body>
</html>
